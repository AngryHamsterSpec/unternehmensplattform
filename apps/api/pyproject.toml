[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "unternehmensplattform"
version = "0.1.0"
description = "Nachvollziehbare Unternehmens- und Architekturentscheidungen"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.137,<0.142",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2,<3",
  "SQLAlchemy>=2.0.50,<2.1",
  "alembic>=1.19,<1.20",
  "psycopg[binary]>=3.3,<4",
  "PyJWT[crypto]>=2.10,<3",
  "cryptography>=46",
  "httpx>=0.28,<1",
  "uvicorn>=0.35,<1",
  "openai>=3,<4",
  "openai-agents>=0.9,<1",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
  "polars==1.44.2",
  "thrift==0.24.0",
]
[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "ruff>=0.12", "mypy>=1.17", "pip-audit>=2.9"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"platform_app.decisions" = ["*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: braucht echte PostgreSQL-Datenbank"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
