name: Plattform und M2-Datenabläufe prüfen
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: phase1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, am 10.09.2026 geprüft
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Gesperrte Abhängigkeiten installieren
        run: |
          python -m pip install --require-hashes -r apps/api/requirements-test.lock
          npm install --global pnpm@11.19.0
          pnpm --dir apps/web install --frozen-lockfile
      - name: Python-Formatierung, Lint, Typen und Unitprüfungen
        env:
          PYTHONPATH: apps/api/src
        run: |
          python -m ruff format --check --config apps/api/pyproject.toml apps/api/src apps/api/tests scripts
          python -m ruff check --config apps/api/pyproject.toml apps/api/src apps/api/tests scripts
          python -m mypy --config-file apps/api/pyproject.toml apps/api/src/platform_app
          python -m pytest apps/api/tests -p no:cacheprovider -q
          python scripts/generate_contracts.py
          pnpm --dir apps/web exec prettier --write src/generated/domain.ts
          git diff --exit-code -- apps/web/src/generated/domain.ts docs/contracts/domain.schema.json
          python scripts/check_docs.py
          python -m unittest discover -s scripts -p "test_*.py"
      - name: Frontend prüfen und bauen
        run: |
          pnpm --dir apps/web run format:check
          pnpm --dir apps/web run lint
          pnpm --dir apps/web run build
          pnpm --dir apps/web run test
      - name: Bekannte Abhängigkeitslücken prüfen
        run: |
          python -m pip_audit --disable-pip --no-deps -r apps/api/requirements.lock
          pnpm --dir apps/web audit --audit-level moderate
      - name: Echten lokalen Stack starten
        run: |
          python scripts/setup_local.py
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 240
          python scripts/setup_data_source_demo.py
      - name: PostgreSQL, Berechtigungen und Transaktionen prüfen
        run: |
          docker compose stop data-worker intelligence-worker
          docker compose --profile test run --build --rm tests
          docker compose up -d --no-deps data-worker intelligence-worker
      - name: Browser mit realem OIDC prüfen
        run: |
          pnpm --dir apps/web exec playwright install --with-deps chromium
          python scripts/run_e2e.py
      - name: Containergrenzen und DB-Ausfall prüfen
        run: python scripts/check_runtime.py
      - name: Neustart und Restore in frischem Volume prüfen
        run: python scripts/check_restore.py --full-stack
      - name: Quellen und Images mit geprüfter Scanner-Fixture untersuchen
        run: |
          python scripts/install_trivy.py
          python scripts/check_security.py
      - name: Anmelde- und Datenablauf nach Neustart erneut prüfen
        run: python scripts/run_e2e.py
      - name: Lokalen CI-Stack beenden
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down --volumes --remove-orphans
          fi
