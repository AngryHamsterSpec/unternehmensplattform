worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 256k;
    client_body_timeout 10s;
    send_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    limit_req_zone $binary_remote_addr zone=login:1m rate=30r/m;
    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        location = /api/v1/auth/login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
        }
        location ~ ^/api/v1/data-uploads/ {
            client_max_body_size 4m;
            proxy_request_buffering off;
            proxy_read_timeout 180s;
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For "";
        }
        location /api/ {
            proxy_buffering off;
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For "";
        }
        location ~ ^/identity/(realms/platform/|resources/) {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port 8080;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location /identity/ { return 404; }
        location ~ /\. { return 404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
